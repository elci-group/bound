[package]
name = "bound-core"
version = "0.1.5"
edition = "2021"
authors = ["Rory Spring-Vanhorne <rory.spring@icloud.com>"]
description = "Core file aggregation engine for bound"
license = "MIT"

[dependencies]
regex = "1.10"
once_cell = "1.21.0"
ignore = "0.4"
sha2 = "0.10"
# form3 and mesut are consumed as pinned git dependencies so the workspace
# builds on a clean machine (CI, downstream consumers like kaptaind's
# release build) — a `path = "../../../sibling"` dependency only resolves on
# a machine with that sibling checked out next to this repo, and an
# unpinned `git` dependency isn't reproducible. Bump `rev` deliberately to
# advance either. For local development against a sibling checkout, create
# a gitignored `.cargo/config.toml` with:
# paths = ["../../../3form", "../../../mesut"]
form3 = { git = "https://github.com/elci-group/form3", rev = "0a3d331a771a1eb6266839c701ee213a44e5f514" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
csv = "1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
toml = "0.8"
dirs = "5.0"
mesut = { git = "https://github.com/elci-group/mesut", rev = "5397efdd0a1621ad0177461af0732a4fa21975d4" }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3.14"
filetime = "0.2"
