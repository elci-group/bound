[package]
name = "bound-core"
version = "0.1.5"
edition = "2021"
authors = ["Rory Spring-Vanhorne <rory.spring@icloud.com>"]
description = "Core file aggregation engine for bound"
license = "MIT"

[dependencies]
regex = "1.10"
once_cell = "1.21.0"
ignore = "0.4"
sha2 = "0.10"
form3 = { git = "https://github.com/elci-group/form3" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
csv = "1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
toml = "0.8"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.14"
filetime = "0.2"
