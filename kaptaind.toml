# kaptaind configuration — adapted from dreamsequence's and obserde's working
# examples for a one-off actuated commit+push of the form3 dependency fix.

[operation]
mode = "actuate"

[capabilities]
network_push = true

[watch]
path = "."
recursive = true
ignore_file = ".kaptainignore"

[cluster]
window = 2

[weights]
s = 0.35
a = 0.30
d = 0.20
r = 0.15

[version_thresholds]
minor = 0.6
patch = 0.0

[push]
enabled = true
branch = "main"

# bound is a normal single-branch app repo pushing straight to main, so the
# default protect_branches = ["main", "master"] safety net is explicitly
# overridden here, same as obserde's kaptaind.toml.
[push.safety]
protect_branches = []

[ratelimit]
min_commit_interval = 2

[trust]
execution = "trusted"

[test]
command = "cargo build --release --locked"
required = true
